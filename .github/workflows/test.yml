name: test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  TEST_ARGS: -coverprofile coverage.out -covermode atomic

jobs:
  test:
    name: test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
        id: go

      - name: Run test
        run: |
          set -xe
          make test
          make testrace

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
          fail-on-error: false
        continue-on-error: true

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  lint:
    name: lint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
        id: go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: "go.mod"

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  all-pass-test:
    if: always()

    needs:
      - test
      - lint
      - govulncheck

    runs-on: ubuntu-latest

    steps:
      - name: check dependent jobs
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
